<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">

<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0F172A"/>
<stop offset="100%" stop-color="#1E293B"/>
</linearGradient>

<linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#10B981"/>
<stop offset="100%" stop-color="#06B6D4"/>
</linearGradient>
</defs>

<rect width="900" height="500" rx="40" fill="url(#bg)"/>

<text x="60" y="80" fill="white" font-size="34" font-family="Segoe UI" font-weight="700">
Project Management
</text>

<text x="60" y="115" fill="#94A3B8" font-size="18" font-family="Segoe UI">
Control tenders, deadlines, tasks and handovers
</text>

<!-- Kanban Board -->
<rect x="120" y="170" width="660" height="250" rx="24" fill="#111827"/>

<!-- Columns -->
<rect x="150" y="210" width="160" height="170" rx="16" fill="#1E293B"/>
<rect x="370" y="210" width="160" height="170" rx="16" fill="#1E293B"/>
<rect x="590" y="210" width="160" height="170" rx="16" fill="#1E293B"/>

<!-- Column headings -->
<rect x="175" y="235" width="80" height="10" rx="5" fill="#10B981"/>
<rect x="395" y="235" width="80" height="10" rx="5" fill="#06B6D4"/>
<rect x="615" y="235" width="80" height="10" rx="5" fill="#10B981"/>

<!-- Cards -->
<rect x="170" y="270" width="115" height="24" rx="8" fill="#334155"/>
<rect x="170" y="310" width="95" height="24" rx="8" fill="#334155"/>

<rect x="390" y="270" width="115" height="24" rx="8" fill="#334155"/>
<rect x="390" y="310" width="95" height="24" rx="8" fill="#334155"/>

<rect x="610" y="270" width="115" height="24" rx="8" fill="#334155"/>
<rect x="610" y="310" width="95" height="24" rx="8" fill="#334155"/>

<!-- Check mark -->
<path d="M650 365 L675 390 L725 330"
stroke="url(#accent)"
stroke-width="12"
stroke-linecap="round"
stroke-linejoin="round"
fill="none"/>

</svg>
