<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">

<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0F172A"/>
<stop offset="100%" stop-color="#1E293B"/>
</linearGradient>

<linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#10B981"/>
<stop offset="100%" stop-color="#06B6D4"/>
</linearGradient>
</defs>

<rect width="900" height="500" rx="40" fill="url(#bg)"/>

<!-- Title -->
<text x="60" y="80"
fill="white"
font-size="34"
font-family="Segoe UI"
font-weight="700">
Analytics
</text>

<text x="60" y="115"
fill="#94A3B8"
font-size="18"
font-family="Segoe UI">
Measure progress and improve continuously
</text>

<!-- Bar Chart -->
<rect x="180" y="300" width="50" height="90" rx="10" fill="#10B981"/>
<rect x="270" y="250" width="50" height="140" rx="10" fill="#06B6D4"/>
<rect x="360" y="200" width="50" height="190" rx="10" fill="#10B981"/>
<rect x="450" y="150" width="50" height="240" rx="10" fill="#06B6D4"/>

<!-- Trend Line -->
<polyline
points="205,290 295,240 385,190 475,140 600,100"
fill="none"
stroke="white"
stroke-width="8"
stroke-linecap="round"
stroke-linejoin="round"/>

<!-- Target Circle -->
<circle cx="720" cy="240" r="80"
fill="#1E293B"
stroke="url(#accent)"
stroke-width="10"/>

<circle cx="720" cy="240" r="50"
fill="none"
stroke="#06B6D4"
stroke-width="8"/>

<circle cx="720" cy="240" r="20"
fill="#10B981"/>

</svg>
