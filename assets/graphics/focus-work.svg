<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">

<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0F172A"/>
<stop offset="100%" stop-color="#1E293B"/>
</linearGradient>

<linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#10B981"/>
<stop offset="100%" stop-color="#06B6D4"/>
</linearGradient>
</defs>

<rect width="900" height="500" rx="40" fill="url(#bg)"/>

<!-- Title -->
<text x="60" y="80"
fill="white"
font-size="34"
font-family="Segoe UI"
font-weight="700">
Deep Focus
</text>

<text x="60" y="115"
fill="#94A3B8"
font-size="18"
font-family="Segoe UI">
Protect your attention and work with intention
</text>

<!-- Clock -->
<circle cx="300" cy="270"
r="100"
fill="#1E293B"
stroke="url(#accent)"
stroke-width="10"/>

<!-- Hands -->
<line x1="300" y1="270" x2="300" y2="210"
stroke="white"
stroke-width="8"
stroke-linecap="round"/>

<line x1="300" y1="270" x2="345" y2="290"
stroke="white"
stroke-width="8"
stroke-linecap="round"/>

<!-- Pomodoro -->
<circle cx="620" cy="250"
r="80"
fill="#1E293B"/>

<path
d="M620 170
A80 80 0 1 1 560 190"
fill="none"
stroke="#10B981"
stroke-width="14"
stroke-linecap="round"/>

<!-- Check mark -->
<path
d="M580 250 L610 280 L660 220"
stroke="#06B6D4"
stroke-width="10"
stroke-linecap="round"
stroke-linejoin="round"
fill="none"/>

</svg>
