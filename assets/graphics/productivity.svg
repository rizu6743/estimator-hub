<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">

<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0F172A"/>
<stop offset="100%" stop-color="#1E293B"/>
</linearGradient>

<linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#10B981"/>
<stop offset="100%" stop-color="#06B6D4"/>
</linearGradient>
</defs>

<rect width="900" height="500" rx="40" fill="url(#bg)"/>

<!-- Title -->
<text x="60" y="80"
fill="white"
font-size="34"
font-family="Segoe UI"
font-weight="700">
Productivity
</text>

<text x="60" y="115"
fill="#94A3B8"
font-size="18"
font-family="Segoe UI">
Small daily improvements compound into success
</text>

<!-- Rising chart -->
<polyline
points="120,360 220,310 320,270 420,210 520,170 620,120"
fill="none"
stroke="url(#accent)"
stroke-width="12"
stroke-linecap="round"
stroke-linejoin="round"/>

<!-- Nodes -->
<circle cx="120" cy="360" r="12" fill="#10B981"/>
<circle cx="220" cy="310" r="12" fill="#10B981"/>
<circle cx="320" cy="270" r="12" fill="#10B981"/>
<circle cx="420" cy="210" r="12" fill="#10B981"/>
<circle cx="520" cy="170" r="12" fill="#10B981"/>
<circle cx="620" cy="120" r="12" fill="#06B6D4"/>

<!-- Checklist card -->
<rect x="670" y="180"
width="150"
height="150"
rx="20"
fill="#1E293B"/>

<circle cx="710" cy="220" r="10" fill="#10B981"/>
<circle cx="710" cy="260" r="10" fill="#10B981"/>
<circle cx="710" cy="300" r="10" fill="#10B981"/>

<line x1="735" y1="220" x2="790" y2="220"
stroke="#94A3B8"
stroke-width="5"/>

<line x1="735" y1="260" x2="790" y2="260"
stroke="#94A3B8"
stroke-width="5"/>

<line x1="735" y1="300" x2="790" y2="300"
stroke="#94A3B8"
stroke-width="5"/>

</svg>
