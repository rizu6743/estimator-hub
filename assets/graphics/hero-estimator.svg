<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" rx="40" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="50" y="70"
        fill="white"
        font-size="34"
        font-family="Segoe UI"
        font-weight="700">
      Estimator Hub
  </text>

  <text x="50" y="110"
        fill="#94A3B8"
        font-size="18"
        font-family="Segoe UI">
      Tender Productivity Operating System
  </text>

  <!-- Laptop -->
  <rect x="430" y="100"
        width="320"
        height="190"
        rx="20"
        fill="#111827"/>

  <rect x="450" y="120"
        width="280"
        height="150"
        rx="10"
        fill="#1E293B"/>

  <!-- Chart -->
  <rect x="480" y="210" width="30" height="40" rx="5" fill="#10B981"/>
  <rect x="530" y="180" width="30" height="70" rx="5" fill="#06B6D4"/>
  <rect x="580" y="150" width="30" height="100" rx="5" fill="#10B981"/>
  <rect x="630" y="130" width="30" height="120" rx="5" fill="#06B6D4"/>

  <!-- Laptop base -->
  <rect x="390" y="295"
        width="400"
        height="18"
        rx="9"
        fill="#334155"/>

  <!-- BOQ Sheet -->
  <rect x="90" y="180"
        width="150"
        height="180"
        rx="15"
        fill="white"/>

  <line x1="110" y1="220" x2="210" y2="220"
        stroke="#CBD5E1"
        stroke-width="5"/>

  <line x1="110" y1="255" x2="210" y2="255"
        stroke="#CBD5E1"
        stroke-width="5"/>

  <line x1="110" y1="290" x2="210" y2="290"
        stroke="#CBD5E1"
        stroke-width="5"/>

  <!-- Calculator -->
  <rect x="270" y="230"
        width="90"
        height="120"
        rx="15"
        fill="#334155"/>

  <rect x="290" y="250"
        width="50"
        height="20"
        rx="5"
        fill="#06B6D4"/>

  <!-- Coffee Cup -->
  <circle cx="760" cy="360"
          r="40"
          fill="#78350F"/>

  <circle cx="760" cy="360"
          r="28"
          fill="#D6D3D1"/>

  <!-- Checklist -->
  <rect x="540" y="340"
        width="180"
        height="90"
        rx="20"
        fill="#1E293B"/>

  <circle cx="570" cy="370" r="8" fill="#10B981"/>
  <circle cx="570" cy="400" r="8" fill="#10B981"/>

  <line x1="590" y1="370" x2="680" y2="370"
        stroke="#94A3B8"
        stroke-width="4"/>

  <line x1="590" y1="400" x2="670" y2="400"
        stroke="#94A3B8"
        stroke-width="4"/>

</svg>
